[project]
name = "beans-next-af3-launcher"
version = "0.0.0"
description = "BEANS-Next AF3 launcher (launcher-only; not core deps)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.7",
]

# PyTorch CUDA wheels: install from the official index so the build matches the
# NVIDIA driver. Default PyPI `torch` may resolve to a newer CUDA build that the
# driver does not support.
[tool.uv]
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.optional-dependencies]
# Real inference deps (GPU required; keep launcher-only).
gpu = [
  "torch==2.5.1",
  "transformers==5.16.1",
  "huggingface-hub>=1.5.0,<2.0",
  "accelerate>=1.1.0",
  "soundfile>=0.12.1",
  "librosa>=0.11.0",
]

[dependency-groups]
gpu = [
  "torch==2.5.1",
  "transformers==5.16.1",
  "huggingface-hub>=1.5.0,<2.0",
  "accelerate>=1.1.0",
  "soundfile>=0.12.1",
  "librosa>=0.11.0",
]

