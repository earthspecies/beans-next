[project]
name = "beans-next-naturelm-v1-0-launcher"
version = "0.0.0"
description = "BEANS-Next NatureLM-audio v1.0 launcher (launcher-only; not core deps)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.7",
  "requests==2.32.3",
  "soundfile>=0.12.0",
  # Keep compatible with transformers==4.44.2.
  "huggingface-hub>=0.23.2,<1.0.0",
  "numpy>=1.26.4",
  # Some NatureLM-audio deps import pkg_resources from setuptools.
  "setuptools<81",
]

[project.optional-dependencies]
# Real inference deps (GPU required; keep launcher-only).
real = [
  # Pinned to a CUDA 12 build of PyTorch.
  "torch==2.5.1",
  "torchaudio==2.5.1",
  # NatureLM-audio v1.0 requires the Transformers 4.44 API.
  "transformers[sentencepiece]==4.44.2",
]

[dependency-groups]
real = [
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "transformers[sentencepiece]==4.44.2",
]

