# BEANS-Next Tier 3 (structural / relational / counting) — NatureLM-audio v1.1 base
# (ckpt 1290000, Llama 3.1-8B, 16 kHz BEATs). Uses examples/servers/naturelm-v1.1/ launcher.
#
# Submit env:
#   export NATURELM_GCS_CHECKPOINT_URI=gs://foundation-models/naturelm-audio-1.1/base_model/1290000
#   export ESP_RESEARCH_LOCAL_PATH=/home/$USER/esp-data-dev/esp-research

models:
  - inline:
      name: "naturelm-v1.1-base-tier3"
      description: "NatureLM-audio v1.1 base (ckpt 1290000) on beans_next_tier_3_hf (full N)"
      predict_url: http://127.0.0.1:8001/predict
      info_url: http://127.0.0.1:8001/info
      health_url: http://127.0.0.1:8001/health
      response_schema: predictions_v1
      audio_payload: base64_wav
      retry_policy:
        max_attempts: 12
        backoff_initial: 0.5
        backoff_max: 10.0

suite: beans_next_tier_3_hf
data_source: esp_data
