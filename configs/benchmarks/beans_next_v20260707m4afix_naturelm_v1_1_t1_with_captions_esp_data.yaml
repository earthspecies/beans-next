# BEANS-Next v20260707m4afix — NatureLM-audio v1.1 tier1 fine-tune
# (t1_with_captions checkpoint 70000, Llama 3.1-8B backbone, 16 kHz BEATs).
#
# The T1-specialist counterpart to the T2 fine-tune. Runs the full 14-task
# m4afix suite so its T1 columns are directly comparable with every other
# model (same splits, same 10 s cap, full N).
#
# Submit env:
#   export NATURELM_GCS_CHECKPOINT_URI=gs://foundation-model-data/synthetic/ckpts/t1_with_captions/70000
#   export ESP_RESEARCH_LOCAL_PATH=/home/$USER/esp-data-dev/esp-research
#   export NATURELM_MAX_AUDIO_SECONDS=10

models:
  - inline:
      name: "naturelm-v1.1-t1-with-captions-70000-m4afix"
      description: "NatureLM-audio v1.1 t1_with_captions ckpt 70000 on v20260707m4afix (10s cap)"
      predict_url: http://127.0.0.1:8001/predict
      info_url: http://127.0.0.1:8001/info
      health_url: http://127.0.0.1:8001/health
      response_schema: predictions_v1
      audio_payload: base64_wav
      retry_policy:
        max_attempts: 12
        backoff_initial: 0.5
        backoff_max: 10.0

suite: beans_next_v20260707m4afix
data_source: esp_data
