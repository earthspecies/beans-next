# Preserve the prompt and reference/query audio order supplied by the dataset.
prompt_id: beans_next.prompt.multiaudio_passthrough.v1
messages:
  - role: user
    content: "{{ metadata.conversation }}"
audio_slots:
  - list_metadata_key: audio_paths
    payload_type: file_path
    sample_rate: 16000
generation_config:
  max_tokens: 512
  temperature: 0.0
