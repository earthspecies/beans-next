[project]
name = "beans-next"
version = "0.1.0"
description = "BEANS-Next: HTTP-first bioacoustics audio-LM benchmark library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "filelock>=3.13",
  "fsspec>=2024.9.0",
  "datasets==3.1.0",
  # Compatible versions for audio and Parquet loading.
  "numpy>=1.24,<2.0",
  "pandas==2.2.3",
  "pyarrow==16.1.0",
  "huggingface-hub==0.25.2",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "soundfile>=0.12.1",
  "librosa>=0.10",
]

[dependency-groups]

dev = [
  "httpx>=0.27,<0.29",
  "build>=1.2.0",
  "pre-commit<=4.2.0",
  "pytest<=7.4.0",
  "ruff<=0.11.2",
  "click<=8.1.7",
  "isort<=5.13.2",
  "yamllint<=1.35.1",
  "deptry<=0.23.0",
  "fastapi<=0.116.1",
  "uvicorn<=0.35.0",
]
[project.scripts]
beans-next = "beans_next.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["beans_next", "tests", "scripts", "docs", "configs", "examples/servers", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["beans_next"]

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "check_*.py",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint]
# List of plugins and Rules
# Pycodestyle all errors and warning, Pydoclint, Pyflakes, bugbear, annotations
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP007", # Check for typing.Union annotations that can be rewritten with PEP 604 syntax
  "UP045", # Check for typing.Optional annotations that can be rewritten with PEP 604 syntax
]
extend-select = ["DOC", "B9", "B", "E", "W", "ANN"]
fixable = ["ALL"]
unfixable = []
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 10.
max-complexity = 10

[tool.codespell]
skip = "*.csv"

[tool.deptry]
exclude = [".venv", "tests"]
extend_exclude = [
  "examples/servers/*",
  "scripts",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pandas", # Pin the version used by the datasets runtime.
  "librosa",
  "soundfile",
  "ffmpeg",
  "pyarrow",
  "huggingface-hub",
]
DEP003 = ["librosa"]

[tool.uv]
default-groups = []
